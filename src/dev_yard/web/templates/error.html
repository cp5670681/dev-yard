<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ status }} · dev-yard</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0e1218;
      color: #edf2f8;
      font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
    }
    main { max-width: 36rem; padding: 2rem; }
    h1 { font-size: 2rem; margin: 0 0 0.5rem; font-weight: 600; }
    p { margin: 0; color: #8b97a8; line-height: 1.5; }
    a {
      display: inline-block;
      margin-top: 1.25rem;
      color: #1a1208;
      background: #e0a04a;
      text-decoration: none;
      border-radius: 8px;
      padding: 0.45rem 0.85rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>{{ status }}</h1>
    <p>{{ detail }}</p>
    <a href="/">回到看板</a>
  </main>
</body>
</html>
