[project]
name = "dev-yard"
version = "0.1.1"
description = "Multi-repo requirement worktrees and DAG implement/review"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.15",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "markdown>=3.6",
]
[project.scripts]
dev-yard = "dev_yard.cli:app"
devyard = "dev_yard.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = [
    "src/dev_yard/web/spa",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dev_yard"]

[tool.hatch.build.targets.wheel.force-include]
".pi/skills" = "dev_yard/skills"
".pi/extensions" = "dev_yard/extensions"

# Keep the skills at their original path in the sdist: the wheel target above
# force-includes `.pi/skills`, so building a wheel *from the sdist* needs it to
# exist there (remapping it to dev_yard/skills broke `uv build`).
[tool.hatch.build.targets.sdist.force-include]
".pi/skills" = ".pi/skills"
".pi/extensions" = ".pi/extensions"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "spa: mark test as requiring built SPA",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "PIE", "UP"]
ignore = [
    "B008",  # typer.Option()/Field() in defaults is idiomatic here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

