[project]
name = "dev-yard"
version = "0.1.0"
description = "Multi-repo requirement worktrees and DAG implement/review"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.15",
]
scripts.yard = "dev_yard.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
[tool.hatch.build.targets.wheel]
packages = ["src/dev_yard"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
