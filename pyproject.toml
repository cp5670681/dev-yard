[project]
name = "dev-yard"
version = "0.1.1"
description = "Multi-repo requirement worktrees and DAG implement/review"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.15",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "markdown>=3.6",
]
[project.scripts]
dev-yard = "dev_yard.cli:app"
devyard = "dev_yard.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = [
    "src/dev_yard/web/spa",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dev_yard"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "spa: mark test as requiring built SPA",
]
